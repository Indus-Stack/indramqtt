[example]
area = "api"
item = "getVerifyStats"
kind = "api"
request = "GET /api/v1/auth/verify_stats after the flow creates a user and connects it"
expect = "counted"
expected = "The broker counts at least one password verification after the client connects."

script = '''
import socket
import struct

from config_probe import MQTT_PORT, disconnect, frame, http, packet, word

status, _ = http(
    "POST",
    "/api/v1/auth/users",
    {"username": "doc-verify-user", "password": "DocsVerifyPw1!"},
)
assert status == 201, status
sock = socket.create_connection(("127.0.0.1", MQTT_PORT), timeout=10)
sock.settimeout(10)
flags = 0x02 | 0x80 | 0x40
body = (
    word("MQTT")
    + b"\x04"
    + bytes([flags])
    + struct.pack("!H", 60)
    + word("doc-verify-client")
    + word("doc-verify-user")
    + word("DocsVerifyPw1!")
)
sock.sendall(frame(16, body))
head, ack = packet(sock)
disconnect(sock)
assert head == 0x20 and ack == b"\x00\x00", (head, ack.hex())
status, stats = http("GET", "/api/v1/auth/verify_stats")
assert status == 200, (status, stats)
assert isinstance(stats.get("verifications"), int), stats
assert stats["verifications"] >= 1, stats
assert isinstance(stats.get("dedup_joins"), int), stats
code, _ = http("DELETE", "/api/v1/auth/users/doc-verify-user")
assert code == 204, code
print("counted")
'''
