[example]
area = "rules"
item = "fn-gunzip"
kind = "rule-test"

[[case]]
sql = "SELECT gunzip(gzip('hello gunzip')) AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": "hello gunzip"}'

[[case]]
sql = "SELECT gunzip('!!!not-base64!!!') AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": null}'

[[case]]
sql = "SELECT gunzip() AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": null}'
