[example]
area = "rules"
item = "fn-div"
kind = "rule-test"

[[case]]
sql = 'SELECT div(7, 2) AS v FROM "sensors/+"'
topic = "sensors/kitchen"
payload = '{}'
expect_matched = true
expect_projected = '{"v": 3}'

[[case]]
sql = 'SELECT div(1, 0) AS v FROM "sensors/+"'
topic = "sensors/kitchen"
payload = '{}'
expect_matched = true
expect_projected = '{"v": null}'

[[case]]
sql = 'SELECT div(7.5, 2) AS v FROM "sensors/+"'
topic = "sensors/kitchen"
payload = '{}'
expect_matched = true
expect_projected = '{"v": 3}'
