[example]
area = "rules"
item = "clause-limit"
kind = "rule-test"

[[case]]
sql = 'SELECT temperature FROM "sensors/+" LIMIT 10'
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"temperature": 72.5}'

[[case]]
sql = 'SELECT temperature FROM "sensors/+" LIMIT 0'
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"temperature": 72.5}'
