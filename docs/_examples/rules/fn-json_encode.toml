[example]
area = "rules"
item = "fn-json_encode"
kind = "rule-test"

[[case]]
sql = "SELECT json_encode(42) AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": "42"}'

[[case]]
sql = "SELECT json_encode(true) AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": "true"}'

[[case]]
sql = "SELECT json_encode([1, 2, 3]) AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": "[1,2,3]"}'

[[case]]
sql = "SELECT json_encode() AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": null}'
