[example]
area = "rules"
item = "fn-int"
kind = "rule-test"

[[case]]
sql = "SELECT int('42') AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": 42}'

[[case]]
sql = "SELECT int(3.9) AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": 3}'

[[case]]
sql = "SELECT int(true) AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": 1}'

[[case]]
sql = "SELECT int('x') AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": null}'

[[case]]
sql = "SELECT int() AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": null}'
