[example]
area = "rules"
item = "fn-is_not_null_var"
kind = "rule-test"

[[case]]
sql = "SELECT is_not_null_var(count) AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5, "count": 3, "items": {"a": 1}, "tags": [1, 2], "name": "", "flag": null}'
expect_matched = true
expect_projected = '{"v": true}'

[[case]]
sql = "SELECT is_not_null_var(flag) AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5, "count": 3, "items": {"a": 1}, "tags": [1, 2], "name": "", "flag": null}'
expect_matched = true
expect_projected = '{"v": false}'

[[case]]
sql = "SELECT is_not_null_var(missing) AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5, "count": 3, "items": {"a": 1}, "tags": [1, 2], "name": "", "flag": null}'
expect_matched = true
expect_projected = '{"v": false}'

[[case]]
sql = "SELECT is_not_null_var('a', 'b') AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5, "count": 3, "items": {"a": 1}, "tags": [1, 2], "name": "", "flag": null}'
expect_matched = true
expect_projected = '{"v": null}'
