[example]
area = "rules"
item = "fn-std_base64_decode"
kind = "rule-test"

[[case]]
sql = "SELECT std_base64_decode('YWI=') AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": "ab"}'

[[case]]
sql = "SELECT std_base64_decode('!!!') AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": null}'

[[case]]
sql = "SELECT std_base64_decode(NULL) AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": null}'

[[case]]
sql = "SELECT std_base64_decode() AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": null}'
