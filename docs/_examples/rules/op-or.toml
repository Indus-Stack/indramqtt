[example]
area = "rules"
item = "op-or"
kind = "rule-test"

[[case]]
sql = 'SELECT temperature FROM "sensors/+" WHERE temperature > 100 OR temperature < 80'
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"temperature": 72.5}'

[[case]]
sql = 'SELECT temperature FROM "sensors/+" WHERE temperature > 100 OR temperature < 80'
topic = "sensors/kitchen"
payload = '{"temperature": 90.0}'
expect_matched = false
