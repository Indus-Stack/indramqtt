[example]
area = "rules"
item = "fn-msgid"
kind = "rule-test"

[[case]]
sql = 'SELECT msgid() AS m FROM "sensors/+"'
topic = "sensors/kitchen"
payload = '{"id": "5f2a"}'
expect_matched = true
expect_projected = '{"m": "5f2a"}'

[[case]]
sql = 'SELECT msgid() AS m FROM "sensors/+"'
topic = "sensors/kitchen"
payload = '{}'
expect_matched = true
expect_projected = '{"m": null}'

[[case]]
sql = 'SELECT msgid() AS m FROM "sensors/+"'
topic = "sensors/kitchen"
payload = '{"id": 5}'
expect_matched = true
expect_projected = '{"m": 5}'
