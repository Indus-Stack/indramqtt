[example]
area = "rules"
item = "fn-proc_dict_put"
kind = "rule-test"

[[case]]
sql = "SELECT proc_dict_put('dx2-state-k1', 1) AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": null}'

[[case]]
sql = "SELECT proc_dict_put('dx2-state-k1') AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": null}'
