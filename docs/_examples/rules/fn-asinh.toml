[example]
area = "rules"
item = "fn-asinh"
kind = "rule-test"

[[case]]
sql = 'SELECT asinh(1.0) AS v FROM "sensors/+"'
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": 0.881373587019543}'

[[case]]
sql = 'SELECT asinh(1.0, 2.0) AS v FROM "sensors/+"'
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": null}'
