[example]
area = "rules"
item = "fn-contains_topic"
kind = "rule-test"

[[case]]
sql = "SELECT contains_topic(topics, 'sensors/kitchen') AS c FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"topics": ["sensors/kitchen"]}'
expect_matched = true
expect_projected = '{"c": true}'

[[case]]
sql = "SELECT contains_topic(topics, 'sensors/kitchen') AS c FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"topics": ["sensors/+"]}'
expect_matched = true
expect_projected = '{"c": false}'
