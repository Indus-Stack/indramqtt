[example]
area = "rules"
item = "fn-rfc3339_to_unix_ts"
kind = "rule-test"

[[case]]
sql = "SELECT rfc3339_to_unix_ts('1970-01-01T00:00:00Z') AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": 0}'

[[case]]
sql = "SELECT rfc3339_to_unix_ts('nope') AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": null}'
