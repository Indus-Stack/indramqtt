[example]
area = "rules"
item = "fn-gzip"
kind = "rule-test"

[[case]]
sql = "SELECT gunzip(gzip('hello gzip')) AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": "hello gzip"}'

[[case]]
sql = "SELECT gzip(NULL) AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": null}'

[[case]]
sql = "SELECT gzip() AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": null}'
