[example]
area = "rules"
item = "fn-bitsl"
kind = "rule-test"

[[case]]
sql = 'SELECT bitsl(1, 3) AS v FROM "sensors/+"'
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": 8}'

[[case]]
sql = 'SELECT bitsl(1, 64) AS v FROM "sensors/+"'
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": null}'

[[case]]
sql = 'SELECT bitsl(1.9, 2) AS v FROM "sensors/+"'
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": 4}'

[[case]]
sql = 'SELECT bitsl(3, 63) AS v FROM "sensors/+"'
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": -9223372036854775808}'
