[example]
area = "rules"
item = "fn-unzip"
kind = "rule-test"

[[case]]
sql = "SELECT unzip(zip('hello unzip')) AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": "hello unzip"}'

[[case]]
sql = "SELECT unzip('!!!not-base64!!!') AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": null}'

[[case]]
sql = "SELECT unzip() AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": null}'
