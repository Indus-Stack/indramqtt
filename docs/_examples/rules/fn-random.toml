[example]
area = "rules"
item = "fn-random"
kind = "rule-test"

[[case]]
sql = 'SELECT 1 AS v FROM "sensors/+" WHERE random() IS NOT NULL'
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": 1}'

[[case]]
sql = 'SELECT random(1) AS v FROM "sensors/+"'
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": null}'
