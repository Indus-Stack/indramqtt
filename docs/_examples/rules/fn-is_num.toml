[example]
area = "rules"
item = "fn-is_num"
kind = "rule-test"

[[case]]
sql = "SELECT is_num(1) AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5, "count": 3, "items": {"a": 1}, "tags": [1, 2], "name": "", "flag": null}'
expect_matched = true
expect_projected = '{"v": true}'

[[case]]
sql = "SELECT is_num(1.5) AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5, "count": 3, "items": {"a": 1}, "tags": [1, 2], "name": "", "flag": null}'
expect_matched = true
expect_projected = '{"v": true}'

[[case]]
sql = "SELECT is_num('1') AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5, "count": 3, "items": {"a": 1}, "tags": [1, 2], "name": "", "flag": null}'
expect_matched = true
expect_projected = '{"v": false}'

[[case]]
sql = "SELECT is_num() AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5, "count": 3, "items": {"a": 1}, "tags": [1, 2], "name": "", "flag": null}'
expect_matched = true
expect_projected = '{"v": null}'
