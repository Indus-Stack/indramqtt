[example]
area = "rules"
item = "event-events-message_acked"
kind = "rule-test"

[[case]]
sql = 'SELECT msg_id FROM "$events/message_acked"'
topic = "$events/message_acked"
payload = '{"msg_id": 7}'
expect_matched = true
expect_projected = '{"msg_id": 7}'

[[case]]
sql = 'SELECT msg_id FROM "$events/message_acked"'
topic = "sensors/kitchen"
payload = '{"msg_id": 7}'
expect_matched = false
