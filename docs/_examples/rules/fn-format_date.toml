[example]
area = "rules"
item = "fn-format_date"
kind = "rule-test"

[[case]]
sql = "SELECT format_date('second', 0, 'yyyy-MM-dd', 0) AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": "1970-01-01"}'

[[case]]
sql = "SELECT format_date('bogus', 0, 'yyyy-MM-dd', 0) AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": null}'
