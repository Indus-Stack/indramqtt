[example]
area = "rules"
item = "fn-kv_store_get"
kind = "rule-test"

[[case]]
sql = "SELECT kv_store_get('dx2-state-missing-1') AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": null}'

[[case]]
sql = "SELECT kv_store_get('dx2-state-missing-1', 'fallback') AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": "fallback"}'

[[case]]
sql = "SELECT kv_store_get('a', 'b', 'c') AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": null}'
