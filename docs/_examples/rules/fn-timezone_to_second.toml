[example]
area = "rules"
item = "fn-timezone_to_second"
kind = "rule-test"

[[case]]
sql = "SELECT timezone_to_second('Z') AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": 0}'

[[case]]
sql = 'SELECT timezone_to_second(zone) AS v FROM "sensors/+"'
topic = "sensors/kitchen"
payload = '{"zone": "Mars/Olympus"}'
expect_matched = true
expect_projected = '{"v": null}'

[[case]]
sql = 'SELECT timezone_to_second() AS v FROM "sensors/+"'
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": null}'
