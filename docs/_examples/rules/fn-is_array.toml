[example]
area = "rules"
item = "fn-is_array"
kind = "rule-test"

[[case]]
sql = "SELECT is_array([1, 2]) AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5, "count": 3, "items": {"a": 1}, "tags": [1, 2], "name": "", "flag": null}'
expect_matched = true
expect_projected = '{"v": true}'

[[case]]
sql = "SELECT is_array('{\"a\":1}') AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5, "count": 3, "items": {"a": 1}, "tags": [1, 2], "name": "", "flag": null}'
expect_matched = true
expect_projected = '{"v": false}'

[[case]]
sql = "SELECT is_array(items) AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5, "count": 3, "items": {"a": 1}, "tags": [1, 2], "name": "", "flag": null}'
expect_matched = true
expect_projected = '{"v": false}'

[[case]]
sql = "SELECT is_array() AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5, "count": 3, "items": {"a": 1}, "tags": [1, 2], "name": "", "flag": null}'
expect_matched = true
expect_projected = '{"v": null}'
