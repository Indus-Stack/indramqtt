[example]
area = "rules"
item = "fn-first"
kind = "rule-test"

[[case]]
sql = "SELECT first(nums) AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5, "count": 3, "items": {"a": 1}, "tags": [1, 2], "name": "", "flag": null, "nums": [10, 20, 30]}'
expect_matched = true
expect_projected = '{"v": 10}'

[[case]]
sql = "SELECT first([]) AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5, "count": 3, "items": {"a": 1}, "tags": [1, 2], "name": "", "flag": null, "nums": [10, 20, 30]}'
expect_matched = true
expect_projected = '{"v": null}'

[[case]]
sql = "SELECT first('x') AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5, "count": 3, "items": {"a": 1}, "tags": [1, 2], "name": "", "flag": null, "nums": [10, 20, 30]}'
expect_matched = true
expect_projected = '{"v": null}'
