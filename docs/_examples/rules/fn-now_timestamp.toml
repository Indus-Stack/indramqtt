[example]
area = "rules"
item = "fn-now_timestamp"
kind = "rule-test"

[[case]]
sql = 'SELECT 1 AS v FROM "sensors/+" WHERE now_timestamp() IS NOT NULL'
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": 1}'

[[case]]
sql = "SELECT now_timestamp('bogus') AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": null}'
