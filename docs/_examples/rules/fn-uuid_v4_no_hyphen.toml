[example]
area = "rules"
item = "fn-uuid_v4_no_hyphen"
kind = "rule-test"

[[case]]
sql = 'SELECT 1 AS v FROM "sensors/+" WHERE uuid_v4_no_hyphen() IS NOT NULL'
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": 1}'

[[case]]
sql = "SELECT uuid_v4_no_hyphen('x') AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": null}'
