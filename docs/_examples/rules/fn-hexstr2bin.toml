[example]
area = "rules"
item = "fn-hexstr2bin"
kind = "rule-test"

[[case]]
sql = "SELECT hexstr2bin('4142') AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": "AB"}'

[[case]]
sql = "SELECT hexstr2bin('0x4142', '0x') AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": "AB"}'

[[case]]
sql = "SELECT hexstr2bin('zz') AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": null}'

[[case]]
sql = "SELECT hexstr2bin('414') AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": null}'

[[case]]
sql = "SELECT hexstr2bin('FF') AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": null}'

[[case]]
sql = "SELECT hexstr2bin() AS v FROM \"sensors/+\""
topic = "sensors/kitchen"
payload = '{"temperature": 72.5}'
expect_matched = true
expect_projected = '{"v": null}'
