[example]
area = "config"
item = "prometheus.push_gateway.interval"
kind = "setting"
expect = "push_interval=30s"
expected = "The broker stores the interval text and shows it from the exporter settings."
source = "`crates/broker-config/src/schema.rs` documents `prometheus.push_gateway.interval`, and `crates/broker-node/src/main.rs` copies the file value into the registry."
action = "Start the broker with a custom push interval and read `GET /api/v5/prometheus`."
config = '''
[prometheus.push_gateway]
interval = "30s"
'''
script = '''
from config_probe import *
status, body = http("GET", "/api/v5/prometheus")
assert status == 200, (status, body)
assert body["push_gateway"]["interval"] == "30s", body
print("push_interval=30s")
'''
