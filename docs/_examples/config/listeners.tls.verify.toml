[example]
area = "config"
item = "listeners.tls.verify"
kind = "setting"
expect = "verify-peer-optional-ok"
expected = "A client without a certificate still connects under `verify_peer`, and a client with a valid certificate connects."
source = "`crates/broker-node/src/native.rs` checks the chain but allows an empty one when `fail_if_no_peer_cert` is false."
action = "Connect one TLS client without a certificate and one with a valid certificate."
config = '''
[listeners.tls]
enabled = true
bind = "127.0.0.1:28883"
cert_file = "/work/tree/crates/broker-node/tests/k1_05/server-cert.pem"
key_file = "/work/tree/crates/broker-node/tests/k1_05/server-key.pem"
verify = "verify_peer"
cacertfile = "/work/tree/crates/broker-node/tests/k1_05/ca-cert.pem"
'''
script = '''
from config_probe import *
import socket
import ssl
import struct

CERT = "/work/tree/crates/broker-node/tests/k1_05"

def connect_bytes(client, username=None, password=None):
    flags = 0x02 | (0x80 if username else 0) | (0x40 if password else 0)
    body = word("MQTT") + b"\x04" + bytes([flags]) + struct.pack("!H", 60) + word(client)
    if username:
        body += word(username)
    if password:
        body += word(password)
    return frame(0x10, body)

def tls_dial(cert=None, key=None):
    raw = socket.create_connection(("127.0.0.1", 28883), timeout=10)
    ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT)
    ctx.check_hostname = False
    ctx.verify_mode = ssl.CERT_NONE
    if cert:
        ctx.load_cert_chain(cert, key)
    sock = ctx.wrap_socket(raw, server_hostname="localhost")
    sock.settimeout(10)
    return sock

status, _ = http("POST", "/api/v1/auth/users", {"username": "docs-tls", "password": "docs-pw-0001"})
assert status in (200, 201), status
plain = tls_dial()
plain.sendall(connect_bytes("tls-mode-1", "docs-tls", "docs-pw-0001"))
head, ack = packet(plain)
assert head == 0x20 and ack == b"\x00\x00", (head, ack.hex())
plain.close()
valid = tls_dial(CERT + "/client-a-cert.pem", CERT + "/client-a-key.pem")
valid.sendall(connect_bytes("tls-mode-2", "docs-tls", "docs-pw-0001"))
head, ack = packet(valid)
assert head == 0x20 and ack == b"\x00\x00", (head, ack.hex())
valid.close()
print("verify-peer-optional-ok")
'''
