[example]
area = "config"
item = "listeners.ws.native"
kind = "setting"
expect = "ignored"
expected = "The broker ignores the deprecated flag and still answers the upgrade."
source = "`crates/broker-node/src/main.rs` warns about the deprecated flag and serves the listener from the kernel."
action = "Set the deprecated flag and run the upgrade."
config = '''
[listeners.ws]
native = true
bind = "127.0.0.1:${COAP_PORT}"

[auth]
allow_anonymous = true

[logging]
level = "warn"
'''
display_config = '''
[listeners.ws]
native = true
bind = "127.0.0.1:8083"
'''
script = '''
from config_probe import *
import os
import socket
ws_port = int(os.environ["COAP_PORT"])
sock = socket.create_connection(("127.0.0.1", ws_port), timeout=5)
sock.settimeout(5)
sock.sendall(
    f"GET /mqtt HTTP/1.1\r\nHost: 127.0.0.1:{ws_port}\r\n"
    "Upgrade: websocket\r\nConnection: Upgrade\r\n"
    "Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==\r\n"
    "Sec-WebSocket-Version: 13\r\n"
    "Sec-WebSocket-Protocol: mqtt\r\n\r\n".encode()
)
answer = b""
while b"\r\n\r\n" not in answer and len(answer) < 2048:
    chunk = sock.recv(512)
    if not chunk:
        break
    answer += chunk
sock.close()
line = answer.decode(errors="replace").splitlines()[0]
assert "101" in line, line
text = log_text()
assert "listeners.ws.native" in text, text[:500]
print("ignored")
'''
