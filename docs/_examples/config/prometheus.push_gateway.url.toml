[example]
area = "config"
item = "prometheus.push_gateway.url"
kind = "setting"
expect = "push_url=9092"
expected = "The broker stores the target URL and shows it from the exporter settings."
source = "`crates/broker-config/src/schema.rs` documents `prometheus.push_gateway.url`, and `crates/broker-node/src/main.rs` copies the file value into the registry."
action = "Start the broker with a custom push URL and read `GET /api/v5/prometheus`."
config = '''
[prometheus.push_gateway]
url = "http://127.0.0.1:9092"
'''
script = '''
from config_probe import *
status, body = http("GET", "/api/v5/prometheus")
assert status == 200, (status, body)
assert body["push_gateway"]["url"] == "http://127.0.0.1:9092", body
print("push_url=9092")
'''
