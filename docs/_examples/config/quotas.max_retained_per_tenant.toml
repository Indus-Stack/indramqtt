[example]
area = "config"
item = "quotas.max_retained_per_tenant"
kind = "setting"
expect = "retained=1"
expected = "With a cap of one, the second retained topic of one tenant drops while the first stays stored."
source = "`crates/broker-node/src/main.rs` copies the file value into the retained store at boot, and the publish path drops a new retained topic past the cap of the publisher tenant."
action = "Publish two retained topics with one username and read the retained count."
config = '''
[quotas]
max_connections_per_tenant = 0
max_sessions_per_tenant = 0
max_retained_per_tenant = 1

[[tenants.rules]]
expression = "t-${username}"
'''
script = '''
from config_probe import *
import socket
import struct
import time

def raw_connect(client, username, password):
    sock = socket.create_connection(("127.0.0.1", MQTT_PORT), timeout=10)
    sock.settimeout(10)
    flags = 0x02 | 0x80 | 0x40
    payload = word(client) + word(username) + word(password)
    body = word("MQTT") + b"\x04" + bytes([flags]) + struct.pack("!H", 60) + payload
    sock.sendall(frame(16, body))
    head, ack = packet(sock)
    return sock, head, ack

status, _ = http("POST", "/api/v1/auth/users?tenant=t-quota-ret", {"username": "quota-ret", "password": "Quota-docs-pw-3"})
assert status in (200, 201), status
status, _ = http("POST", "/api/v1/auth/acls?tenant=t-quota-ret", {"client_pattern": "qr-pub", "action": "all", "topic_pattern": "qr/#", "allow": True})
assert status in (200, 201), status
pub, head, ack = raw_connect("qr-pub", "quota-ret", "Quota-docs-pw-3")
assert head == 0x20 and ack == b"\x00\x00", (head, ack.hex())
publish(pub, "qr/1", b"keep-a", retain=True)

def retained_count():
    status, body = http("GET", "/api/v5/stats")
    assert status == 200, (status, body)
    return body[0].get("retained.count")

stored = wait_for(lambda: retained_count() == 1, timeout=10.0)
assert stored, "first retained topic never landed"
publish(pub, "qr/2", b"drop-a", retain=True)
time.sleep(2.0)
count = retained_count()
disconnect(pub)
assert count == 1, count
print("retained=1")
'''
