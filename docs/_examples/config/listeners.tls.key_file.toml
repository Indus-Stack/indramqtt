[example]
area = "config"
item = "listeners.tls.key_file"
kind = "setting"
expect = "tls-key-ok"
expected = "The TLS handshake succeeds with the configured key, and the row shows the listener running."
source = "`crates/broker-node/src/native.rs` loads the private key from the setting, and a wrong key fails the handshake."
action = "Connect one TLS client with a username and a password, then read `GET /api/v5/listeners/ssl:default`."
config = '''
[listeners.tls]
enabled = true
bind = "127.0.0.1:28883"
cert_file = "${TLS_DIR}/server-cert.pem"
key_file = "${TLS_DIR}/server-key.pem"
'''
script = '''
from config_probe import *
import socket
import ssl
import struct

def connect_bytes(client, username=None, password=None):
    flags = 0x02 | (0x80 if username else 0) | (0x40 if password else 0)
    body = word("MQTT") + b"\x04" + bytes([flags]) + struct.pack("!H", 60) + word(client)
    if username:
        body += word(username)
    if password:
        body += word(password)
    return frame(0x10, body)

status, _ = http("POST", "/api/v1/auth/users", {"username": "docs-tls", "password": "docs-pw-0001"})
assert status in (200, 201), status
raw = socket.create_connection(("127.0.0.1", 28883), timeout=10)
ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT)
ctx.check_hostname = False
ctx.verify_mode = ssl.CERT_NONE
tls = ctx.wrap_socket(raw, server_hostname="localhost")
tls.settimeout(10)
tls.sendall(connect_bytes("tls-key-1", "docs-tls", "docs-pw-0001"))
head, ack = packet(tls)
assert head == 0x20 and ack == b"\x00\x00", (head, ack.hex())
tls.close()
status, row = http("GET", "/api/v5/listeners/ssl:default")
assert status == 200, (status, row)
assert row["running"] is True, row
print("tls-key-ok")
'''
