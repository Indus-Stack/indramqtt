[example]
area = "config"
item = "licence.license_file"
kind = "setting"
expect = "ok"
expected = "The broker accepts the license key file path and starts."
source = "`crates/broker-config/src/schema.rs` documents `licence.license_file` as the path to the enterprise cryptographic license key file."
action = "Start the broker with a license file path and check that `/healthz` answers OK."
config = '''
[licence]
license_file = "/tmp/docs-license.key"
'''
script = '''
from config_probe import *
status, body = http("GET", "/healthz")
assert status == 200, (status, body)
print("ok")
'''
