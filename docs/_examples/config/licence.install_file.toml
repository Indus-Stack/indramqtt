[example]
area = "config"
item = "licence.install_file"
kind = "setting"
expect = "ok"
expected = "The broker installs the licence token from the given path and exits."
source = "`crates/broker-config/src/schema.rs` documents `licence.install_file` as the path to install the licence token from and exit."
action = "Start the broker with an install file path and check that it runs."
config = '''
[licence]
install_file = "/tmp/docs-licence-install.key"
'''
script = '''
from config_probe import *
status, body = http("GET", "/healthz")
assert status == 200, (status, body)
print("ok")
'''
