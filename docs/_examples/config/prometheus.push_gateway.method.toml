[example]
area = "config"
item = "prometheus.push_gateway.method"
kind = "setting"
expect = "push_method=post"
expected = "The broker stores post and shows it from the exporter settings."
source = "`crates/broker-config/src/schema.rs` documents `prometheus.push_gateway.method`, and `crates/broker-node/src/main.rs` copies the file value into the registry."
action = "Start the broker with method post and read `GET /api/v5/prometheus`."
config = '''
[prometheus.push_gateway]
method = "post"
'''
script = '''
from config_probe import *
status, body = http("GET", "/api/v5/prometheus")
assert status == 200, (status, body)
assert body["push_gateway"]["method"] == "post", body
print("push_method=post")
'''
