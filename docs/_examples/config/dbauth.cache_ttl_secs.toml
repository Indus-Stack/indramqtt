[example]
area = "config"
item = "dbauth.cache_ttl_secs"
kind = "setting"
expect = "accepted"
expected = "A cached verdict stays valid for thirty seconds and a second CONNECT succeeds without a new lookup."
source = "`crates/broker-auth/src/db.rs` treats cache entries older than `cache_ttl_secs` as a miss."
action = "Connect twice with a password while a verdict stays valid for thirty seconds."
config = '''
[auth]
allow_anonymous = true

[dbauth]
postgres_url = "postgres://docs:docs@127.0.0.1:9/docs"
cache_ttl_secs = 30
'''
script = '''
from config_probe import *
import socket
import struct

def credentialed():
    sock = socket.create_connection(("127.0.0.1", MQTT_PORT), timeout=10)
    sock.settimeout(10)
    payload = word("db-docs") + word("docs-user") + word("right-password")
    body = word("MQTT") + b"\x04" + bytes([0xC2]) + struct.pack("!H", 60) + payload
    sock.sendall(frame(16, body))
    head, ack = packet(sock)
    sock.close()
    return head, ack

head, ack = credentialed()
assert head == 0x20 and ack == b"\x00\x00", (head, ack.hex())
head, ack = credentialed()
assert head == 0x20 and ack == b"\x00\x00", (head, ack.hex())
print("accepted")
'''
