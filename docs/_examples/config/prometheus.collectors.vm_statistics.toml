[example]
area = "config"
item = "prometheus.collectors.vm_statistics"
kind = "setting"
expect = "vm_statistics=enabled"
expected = "The broker stores enabled and shows it from the exporter settings."
source = "`crates/broker-config/src/schema.rs` documents `prometheus.collectors.vm_statistics`, and `crates/broker-node/src/main.rs` copies the file value into the registry."
action = "Start the broker with the collector on and read `GET /api/v5/prometheus`."
config = '''
[prometheus.collectors]
vm_statistics = "enabled"
'''
script = '''
from config_probe import *
status, body = http("GET", "/api/v5/prometheus")
assert status == 200, (status, body)
assert body["collectors"]["vm_statistics"] == "enabled", body
print("vm_statistics=enabled")
'''
