[example]
area = "config"
item = "prometheus.latency_buckets"
kind = "setting"
expect = "buckets=5ms, 50ms"
expected = "The broker stores the bucket text and shows it from the exporter settings."
source = "`crates/broker-config/src/schema.rs` documents `prometheus.latency_buckets`, and `crates/broker-node/src/main.rs` copies the file value into the registry."
action = "Start the broker with a custom bucket list and read `GET /api/v5/prometheus`."
config = '''
[prometheus]
latency_buckets = "5ms, 50ms"
'''
script = '''
from config_probe import *
status, body = http("GET", "/api/v5/prometheus")
assert status == 200, (status, body)
assert body["latency_buckets"] == "5ms, 50ms", body
print("buckets=5ms, 50ms")
'''
