[example]
area = "config"
item = "prometheus.push_gateway.job_name"
kind = "setting"
expect = "push_job=docs-push-job"
expected = "The broker stores the job template and shows it from the exporter settings."
source = "`crates/broker-config/src/schema.rs` documents `prometheus.push_gateway.job_name`, and `crates/broker-node/src/main.rs` copies the file value into the registry."
action = "Start the broker with a custom job name and read `GET /api/v5/prometheus`."
config = '''
[prometheus.push_gateway]
job_name = "docs-push-job"
'''
script = '''
from config_probe import *
status, body = http("GET", "/api/v5/prometheus")
assert status == 200, (status, body)
assert body["push_gateway"]["job_name"] == "docs-push-job", body
print("push_job=docs-push-job")
'''
