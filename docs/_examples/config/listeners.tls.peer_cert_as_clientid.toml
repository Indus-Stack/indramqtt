[example]
area = "config"
item = "listeners.tls.peer_cert_as_clientid"
kind = "setting"
expect = "clientid=k1-05-a"
expected = "The session uses the certificate common name, not the CONNECT identifier."
source = "`crates/broker-node/src/native.rs` replaces the CONNECT identifier with the certificate common name before the bind."
action = "Connect one TLS client with a valid certificate and an ignored identifier, then read the client detail."
config = '''
[listeners.tls]
enabled = true
bind = "127.0.0.1:28883"
cert_file = "/work/tree/crates/broker-node/tests/k1_05/server-cert.pem"
key_file = "/work/tree/crates/broker-node/tests/k1_05/server-key.pem"
verify = "verify_peer"
cacertfile = "/work/tree/crates/broker-node/tests/k1_05/ca-cert.pem"
peer_cert_as_clientid = "cn"
'''
script = '''
from config_probe import *
import socket
import ssl
import struct

CERT = "/work/tree/crates/broker-node/tests/k1_05"

def connect_bytes(client, username=None, password=None):
    flags = 0x02 | (0x80 if username else 0) | (0x40 if password else 0)
    body = word("MQTT") + b"\x04" + bytes([flags]) + struct.pack("!H", 60) + word(client)
    if username:
        body += word(username)
    if password:
        body += word(password)
    return frame(0x10, body)

status, _ = http("POST", "/api/v1/auth/users", {"username": "docs-tls", "password": "docs-pw-0001"})
assert status in (200, 201), status
raw = socket.create_connection(("127.0.0.1", 28883), timeout=10)
ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT)
ctx.check_hostname = False
ctx.verify_mode = ssl.CERT_NONE
ctx.load_cert_chain(CERT + "/client-a-cert.pem", CERT + "/client-a-key.pem")
tls = ctx.wrap_socket(raw, server_hostname="localhost")
tls.settimeout(10)
tls.sendall(connect_bytes("ignored-id", "docs-tls", "docs-pw-0001"))
head, ack = packet(tls)
assert head == 0x20 and ack == b"\x00\x00", (head, ack.hex())
status, detail = http("GET", "/api/v5/clients/k1-05-a")
assert status == 200, (status, detail)
assert detail["clientid"] == "k1-05-a", detail
status, missing = http("GET", "/api/v5/clients/ignored-id")
assert status == 404, (status, missing)
tls.close()
print("clientid=k1-05-a")
'''
