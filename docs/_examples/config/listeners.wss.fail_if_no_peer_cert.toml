[example]
area = "config"
item = "listeners.wss.fail_if_no_peer_cert"
kind = "setting"
expect = "no-cert-refused"
expected = "A client without a certificate fails, and a client with a valid certificate upgrades."
source = "`crates/broker-node/src/native.rs` requires a certificate when the setting is true with verification on."
action = "Run one secure upgrade without a certificate and one with a valid certificate."
config = '''
[listeners.wss]
enabled = true
bind = "127.0.0.1:28884"
cert_file = "${TLS_DIR}/server-cert.pem"
key_file = "${TLS_DIR}/server-key.pem"
verify = "verify_peer"
cacertfile = "${TLS_DIR}/ca-cert.pem"
fail_if_no_peer_cert = true
'''
script = '''
from config_probe import *
import base64
import os
import socket
import ssl

import os
CERT = os.environ["TLS_DIR"]

def upgrade(cert=None, key=None):
    try:
        raw = socket.create_connection(("127.0.0.1", 28884), timeout=10)
        ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT)
        ctx.check_hostname = False
        ctx.verify_mode = ssl.CERT_NONE
        if cert:
            ctx.load_cert_chain(cert, key)
        tls = ctx.wrap_socket(raw, server_hostname="localhost")
        tls.settimeout(10)
        wskey = base64.b64encode(os.urandom(16)).decode()
        tls.sendall(("GET /mqtt HTTP/1.1\r\nHost: 127.0.0.1\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Key: " + wskey + "\r\nSec-WebSocket-Version: 13\r\nSec-WebSocket-Protocol: mqtt\r\n\r\n").encode())
        resp = b""
        while b"\r\n\r\n" not in resp:
            chunk = tls.recv(4096)
            if not chunk:
                break
            resp += chunk
        tls.close()
        return resp.startswith(b"HTTP/1.1 101")
    except Exception:
        return False

assert upgrade() is False
assert upgrade(CERT + "/client-a-cert.pem", CERT + "/client-a-key.pem") is True
print("no-cert-refused")
'''
