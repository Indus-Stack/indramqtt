[example]
area = "config"
item = "listeners.ws.path"
kind = "setting"
expect = "path-ok"
expected = "The configured path answers 101 and a wrong path gets 404."
source = "`crates/broker-node/src/native.rs` checks the file path on each upgrade."
action = "Run the upgrade on the configured path and on a wrong path."
config = '''
[listeners.ws]
bind = "127.0.0.1:${COAP_PORT}"
path = "/docs-mqtt"

[auth]
allow_anonymous = true
'''
display_config = '''
[listeners.ws]
bind = "127.0.0.1:8083"
path = "/docs-mqtt"
'''
script = '''
from config_probe import *
import os
import socket
ws_port = int(os.environ["COAP_PORT"])
def upgrade(path):
    sock = socket.create_connection(("127.0.0.1", ws_port), timeout=5)
    sock.settimeout(5)
    sock.sendall(
        f"GET {path} HTTP/1.1\r\nHost: 127.0.0.1:{ws_port}\r\n"
        "Upgrade: websocket\r\nConnection: Upgrade\r\n"
        "Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==\r\n"
        "Sec-WebSocket-Version: 13\r\n"
        "Sec-WebSocket-Protocol: mqtt\r\n\r\n".encode()
    )
    answer = b""
    while b"\r\n\r\n" not in answer and len(answer) < 2048:
        chunk = sock.recv(512)
        if not chunk:
            break
        answer += chunk
    sock.close()
    return answer.decode(errors="replace").splitlines()[0]
good = upgrade("/docs-mqtt")
assert "101" in good, good
bad = upgrade("/mqtt")
assert "404" in bad, bad
print("path-ok")
'''
