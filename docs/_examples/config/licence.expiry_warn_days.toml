[example]
area = "config"
item = "licence.expiry_warn_days"
kind = "setting"
expect = "expiry_warn_days=7"
expected = "The licence status reports the configured warning days."
source = "`crates/broker-api/src/licence.rs` documents `expiry_warn_days` as days before expiry that the approaching-expiry alarm and log warning start."
action = "Start the broker with custom warning days, call `GET /api/v1/licence/status`, and check `expiry_warn_days`."
config = '''
[licence]
expiry_warn_days = 7
'''
script = '''
from config_probe import *
status, body = http("GET", "/api/v1/licence/status")
assert status == 200, (status, body)
assert body["expiry_warn_days"] == 7, body
print("expiry_warn_days=7")
'''
