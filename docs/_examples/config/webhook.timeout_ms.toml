[example]
area = "config"
item = "webhook.timeout_ms"
kind = "setting"
expect = "accepted"
expected = "One endpoint round-trip completes within the configured timeout and the CONNECT succeeds."
source = "`crates/broker-auth/src/webhook.rs` bounds each verdict request with `timeout_ms` before it fails closed."
action = "Connect with a password while one request may take three seconds."
config = '''
[auth]
allow_anonymous = true

[webhook]
url = "http://127.0.0.1:9/hook"
timeout_ms = 3000
'''
script = '''
from config_probe import *
import socket
import struct

sock = socket.create_connection(("127.0.0.1", MQTT_PORT), timeout=10)
sock.settimeout(10)
payload = word("hook-docs") + word("docs-user") + word("right-password")
body = word("MQTT") + b"\x04" + bytes([0xC2]) + struct.pack("!H", 60) + payload
sock.sendall(frame(16, body))
head, ack = packet(sock)
sock.close()
assert head == 0x20 and ack == b"\x00\x00", (head, ack.hex())
print("accepted")
'''
