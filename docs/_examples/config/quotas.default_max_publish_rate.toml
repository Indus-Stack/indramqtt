[example]
area = "config"
item = "quotas.default_max_publish_rate"
kind = "setting"
expect = "throttled"
expected = "With a default rate of one message per second, a burst of ten loses most messages."
source = "`crates/broker-config/src/schema.rs` documents the default rate, but no publish path reads it: per-user quotas stay unlimited unless the user row sets them."
action = "Publish a burst of ten and count the deliveries with a default rate of one."
config = '''
[quotas]
default_max_publish_rate = 1
'''
script = '''
from config_probe import *
import socket
import struct

def raw_connect(client, username, password):
    sock = socket.create_connection(("127.0.0.1", MQTT_PORT), timeout=10)
    sock.settimeout(10)
    flags = 0x02 | 0x80 | 0x40
    payload = word(client) + word(username) + word(password)
    body = word("MQTT") + bytes([4]) + bytes([flags]) + struct.pack("!H", 60) + payload
    sock.sendall(frame(16, body))
    head, ack = packet(sock)
    return sock, head, ack

status, _ = http("POST", "/api/v1/auth/users", {"username": "quota-pr", "password": "Quota-docs-pw-5"})
assert status in (200, 201), status
status, _ = http("POST", "/api/v1/auth/acls", {"client_pattern": "qp-both", "action": "all", "topic_pattern": "qp/#", "allow": True})
assert status in (200, 201), status
sock, head, ack = raw_connect("qp-both", "quota-pr", "Quota-docs-pw-5")
assert head == 0x20 and ack == bytes([0, 0]), (head, ack.hex())
subscribe(sock, "qp/flood")
for i in range(10):
    publish(sock, "qp/flood", ("m-%d" % i).encode())
sock.settimeout(3.0)
got = 0
try:
    while True:
        head, body = packet(sock)
        if head & 0xF0 == 0x30:
            got += 1
except Exception:
    pass
disconnect(sock)
assert got < 10, got
print("throttled")
'''
