[example]
area = "config"
item = "prometheus.enable_basic_auth"
kind = "setting"
expect = "basic_auth=false"
expected = "The broker stores false and shows it from the exporter settings."
source = "`crates/broker-config/src/schema.rs` documents `prometheus.enable_basic_auth`, and `crates/broker-node/src/main.rs` copies the file value into the registry."
action = "Start the broker with the flag off and read `GET /api/v5/prometheus`."
config = '''
[prometheus]
enable_basic_auth = false
'''
script = '''
from config_probe import *
status, body = http("GET", "/api/v5/prometheus")
assert status == 200, (status, body)
assert body["enable_basic_auth"] is False, body
print("basic_auth=false")
'''
