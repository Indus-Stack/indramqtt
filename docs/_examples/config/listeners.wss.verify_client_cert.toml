[example]
area = "config"
item = "listeners.wss.verify_client_cert"
kind = "setting"
expect = "verify-legacy-refused"
expected = "A client without a certificate is refused at the bind, and a client with a valid certificate connects."
source = "`crates/broker-node/src/native.rs` requests a client certificate, and `crates/broker-node/src/main.rs` refuses the bind without one under the legacy switch."
action = "Upgrade one secure WebSocket client without a certificate and one with a valid certificate, then send MQTT CONNECT on each."
config = '''
[listeners.wss]
enabled = true
bind = "127.0.0.1:28884"
cert_file = "${TLS_DIR}/server-cert.pem"
key_file = "${TLS_DIR}/server-key.pem"
verify_client_cert = true
cacertfile = "${TLS_DIR}/ca-cert.pem"
'''
script = '''
from config_probe import *
import base64
import os
import socket
import ssl
import struct

import os
CERT = os.environ["TLS_DIR"]

def connect_bytes(client, username=None, password=None):
    flags = 0x02 | (0x80 if username else 0) | (0x40 if password else 0)
    body = word("MQTT") + b"\x04" + bytes([flags]) + struct.pack("!H", 60) + word(client)
    if username:
        body += word(username)
    if password:
        body += word(password)
    return frame(0x10, body)

def ws_recvn(tls, n):
    raw = b""
    while len(raw) < n:
        chunk = tls.recv(n - len(raw))
        if not chunk:
            raise AssertionError("connection closed")
        raw += chunk
    return raw

def ws_send(tls, payload):
    assert len(payload) < 126
    mask = os.urandom(4)
    tls.sendall(bytes([0x82, 0x80 | len(payload)]) + mask + bytes(b ^ mask[i % 4] for i, b in enumerate(payload)))

def ws_recv(tls):
    hdr = ws_recvn(tls, 2)
    assert hdr[0] == 0x82, hdr
    ln = hdr[1] & 0x7F
    if ln == 126:
        ln = struct.unpack("!H", ws_recvn(tls, 2))[0]
    return ws_recvn(tls, ln)

def try_connect(cert, key):
    try:
        raw = socket.create_connection(("127.0.0.1", 28884), timeout=10)
        ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT)
        ctx.check_hostname = False
        ctx.verify_mode = ssl.CERT_NONE
        if cert:
            ctx.load_cert_chain(cert, key)
        tls = ctx.wrap_socket(raw, server_hostname="localhost")
        tls.settimeout(10)
        wskey = base64.b64encode(os.urandom(16)).decode()
        tls.sendall(("GET /mqtt HTTP/1.1\r\nHost: 127.0.0.1\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Key: " + wskey + "\r\nSec-WebSocket-Version: 13\r\nSec-WebSocket-Protocol: mqtt\r\n\r\n").encode())
        resp = b""
        while b"\r\n\r\n" not in resp:
            chunk = tls.recv(4096)
            if not chunk:
                break
            resp += chunk
        if not resp.startswith(b"HTTP/1.1 101"):
            tls.close()
            return False
        ws_send(tls, connect_bytes("wss-legacy-1", "docs-wss", "docs-pw-0001"))
        got = ws_recv(tls)
        tls.close()
        return got == b"\x20\x02\x00\x00"
    except Exception:
        return False

status, _ = http("POST", "/api/v1/auth/users", {"username": "docs-wss", "password": "docs-pw-0001"})
assert status in (200, 201), status
assert try_connect(None, None) is False
assert try_connect(CERT + "/client-a-cert.pem", CERT + "/client-a-key.pem") is True
print("verify-legacy-refused")
'''
