[example]
area = "config"
item = "node.id"
kind = "setting"
expect = "docs-node-7"
expected = "The v5 nodes list names the configured node `docs-node-7`."
source = "`crates/broker-node/src/main.rs` fixes the node name at boot, and `crates/broker-api/src/v5/nodes.rs` renders it."
action = "Read the node list with `GET /api/v5/nodes`."
config = '''
[node]
id = "docs-node-7"
'''
script = '''
from config_probe import *
status, nodes = http("GET", "/api/v5/nodes")
assert status == 200, (status, nodes)
name = nodes[0]["node"].split("@")[0]
assert name == "docs-node-7", name
print(name)
'''
