[example]
area = "config"
item = "cluster.gossip_bind"
kind = "setting"
expect = "ok"
expected = "The broker accepts the gossip bind address and starts."
source = "`crates/broker-config/src/schema.rs` documents `cluster.gossip_bind` as the accepted gossip bind address."
action = "Start the broker with a gossip bind address and check that `/healthz` answers OK."
config = '''
[cluster]
gossip_bind = "127.0.0.1:7996"
'''
script = '''
from config_probe import *
status, body = http("GET", "/healthz")
assert status == 200, (status, body)
print("ok")
'''
