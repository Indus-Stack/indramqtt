[example]
area = "config"
item = "jwks.url"
kind = "setting"
expect = "anonymous-refused credential-denied"
expected = "An anonymous CONNECT is refused and a JWT CONNECT fails closed while the endpoint stays unreachable."
source = "`crates/broker-node/src/main.rs` disables the open mode when `jwks.url` is set, and `crates/broker-auth/src/jwks.rs` denies the token when the fetch fails."
action = "Connect anonymously and with a JWT-shaped password while the JWKS endpoint stays unreachable."
config = '''
[auth]
allow_anonymous = true

[jwks]
url = "https://127.0.0.1:9/jwks.json"
'''
script = '''
from config_probe import *
import socket
import struct

def raw_connect(client, username=None, password=None):
    sock = socket.create_connection(("127.0.0.1", MQTT_PORT), timeout=10)
    sock.settimeout(10)
    flags = 0x02
    payload = word(client)
    if username is not None:
        flags |= 0x80
        payload += word(username)
    if password is not None:
        flags |= 0x40
        payload += word(password)
    body = word("MQTT") + b"\x04" + bytes([flags]) + struct.pack("!H", 60) + payload
    sock.sendall(frame(16, body))
    head, ack = packet(sock)
    sock.close()
    return head, ack

head, ack = raw_connect("anon-docs")
assert head == 0x20 and ack == b"\x00\x05", (head, ack.hex())
token = "eyJhbGciOiJSUzI1NiIsImtpZCI6ImRvY3Mta2V5LTEifQ.eyJzdWIiOiJkb2NzIn0.c2ln"
head, ack = raw_connect("jwt-docs", "docs-user", token)
assert head == 0x20 and ack == b"\x00\x04", (head, ack.hex())
print("anonymous-refused credential-denied")
'''
