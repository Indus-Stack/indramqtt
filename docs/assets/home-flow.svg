<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 160" width="100%" height="auto" style="max-height: 420px; display: block; margin: 0 auto;" role="img" aria-label="Architecture diagram showing flow from Client to IndraMQTT broker, to Rule Engine, and to Connectors">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--sl-color-accent, #00D8F6)" />
    </marker>
  </defs>

  <!-- Box 1: Client -->
  <g class="flow-node">
    <rect x="10" y="20" width="170" height="120" rx="8" fill="var(--sl-color-black, #18181B)" stroke="var(--sl-color-accent, #00D8F6)" stroke-width="2" />
    <text x="95" y="55" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="var(--sl-color-white, #FFFFFF)">Clients</text>
    <text x="95" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="var(--sl-color-gray-3, #D4D4D8)">MQTT 3.1.1 &amp; 5.0</text>
    <text x="95" y="105" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="var(--sl-color-gray-4, #71717A)">TCP, TLS, WebSocket</text>
  </g>

  <!-- Arrow 1: Client -> Broker -->
  <g class="flow-connector">
    <line x1="180" y1="80" x2="228" y2="80" stroke="var(--sl-color-accent, #00D8F6)" stroke-width="2" marker-end="url(#arrow)" />
    <text x="205" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="var(--sl-color-gray-3, #D4D4D8)">CONNECT</text>
    <text x="205" y="98" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="var(--sl-color-gray-3, #D4D4D8)">PUBLISH</text>
  </g>

  <!-- Box 2: Broker -->
  <g class="flow-node">
    <rect x="230" y="20" width="170" height="120" rx="8" fill="var(--sl-color-black, #18181B)" stroke="var(--sl-color-accent, #00D8F6)" stroke-width="2" />
    <text x="315" y="55" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="var(--sl-color-white, #FFFFFF)">IndraMQTT</text>
    <text x="315" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="var(--sl-color-gray-3, #D4D4D8)">Kernel &amp; Sessions</text>
    <text x="315" y="105" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="var(--sl-color-gray-4, #71717A)">Single Rust process</text>
  </g>

  <!-- Arrow 2: Broker -> Rule Engine -->
  <g class="flow-connector">
    <line x1="400" y1="80" x2="448" y2="80" stroke="var(--sl-color-accent, #00D8F6)" stroke-width="2" marker-end="url(#arrow)" />
    <text x="425" y="72" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="var(--sl-color-gray-3, #D4D4D8)">Match</text>
  </g>

  <!-- Box 3: Rule Engine -->
  <g class="flow-node">
    <rect x="450" y="20" width="170" height="120" rx="8" fill="var(--sl-color-black, #18181B)" stroke="var(--sl-color-accent, #00D8F6)" stroke-width="2" />
    <text x="535" y="55" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="var(--sl-color-white, #FFFFFF)">Rule Engine</text>
    <text x="535" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="var(--sl-color-gray-3, #D4D4D8)">Streaming SQL</text>
    <text x="535" y="105" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="var(--sl-color-gray-4, #71717A)">Filter &amp; transform</text>
  </g>

  <!-- Arrow 3: Rule Engine -> Connectors -->
  <g class="flow-connector">
    <line x1="620" y1="80" x2="668" y2="80" stroke="var(--sl-color-accent, #00D8F6)" stroke-width="2" marker-end="url(#arrow)" />
    <text x="645" y="72" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="var(--sl-color-gray-3, #D4D4D8)">Forward</text>
  </g>

  <!-- Box 4: Connectors -->
  <g class="flow-node">
    <rect x="670" y="20" width="180" height="120" rx="8" fill="var(--sl-color-black, #18181B)" stroke="var(--sl-color-accent, #00D8F6)" stroke-width="2" />
    <text x="760" y="55" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="var(--sl-color-white, #FFFFFF)">Connectors</text>
    <text x="760" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="var(--sl-color-gray-3, #D4D4D8)">40+ Data Sinks</text>
    <text x="760" y="105" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="var(--sl-color-gray-4, #71717A)">Bounded buffers &amp; retry</text>
  </g>
</svg>
