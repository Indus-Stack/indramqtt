name: Beta release

on:
  push:
    tags: ['v2026.11.0-beta.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag, merged commit, prior CI, and Docker Hub key
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKERHUBKEY: ${{ secrets.DOCKERHUBKEY }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          workspace_version=$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)
          test "$version" = "$workspace_version"
          test "$version" = "2026.11.0-beta.1"
          test -n "$DOCKERHUBKEY"
          test -f RELEASE_NOTES_2026.11.md
          git fetch --no-tags origin main
          commit=$(git rev-parse HEAD)
          test "$commit" = "$(git rev-parse origin/main)"
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --commit "$commit" --limit 20 --json status,conclusion \
            | jq -e 'any(.[]; .status == "completed" and .conclusion == "success")'
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish-image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: indusstack
          password: ${{ secrets.DOCKERHUBKEY }}
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            indusstack/indramqtt:${{ needs.verify.outputs.version }}
            indusstack/indramqtt:beta
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sync Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: indusstack
          password: ${{ secrets.DOCKERHUBKEY }}
          repository: indusstack/indramqtt
          readme-filepath: ./deploy/docker/README.md
          short-description: "Single-node MQTT broker with streaming SQL and connectors"

  smoke-published-image:
    needs: [verify, publish-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull published digest and start Compose
        env:
          DIGEST: ${{ needs.publish-image.outputs.digest }}
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          docker pull "indusstack/indramqtt@${DIGEST}"
          docker tag "indusstack/indramqtt@${DIGEST}" "indusstack/indramqtt:${VERSION}"
          docker compose up -d --no-build
          for _ in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' indramqtt-broker)
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker logs indramqtt-broker
          exit 1
      - name: Check MQTT, WebSocket, and config override
        run: bash tools/image_smoke.sh indramqtt-broker 1883 8083
      - name: Stop Compose stack
        if: always()
        run: docker compose down -v

  github-release:
    needs: [verify, publish-image, smoke-published-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add tested image digest to release notes
        env:
          DIGEST: ${{ needs.publish-image.outputs.digest }}
        shell: bash
        run: |
          cp RELEASE_NOTES_2026.11.md "$RUNNER_TEMP/release-body.md"
          printf '\n## Published image digest\n\n`indusstack/indramqtt@%s`\n' "$DIGEST" >> "$RUNNER_TEMP/release-body.md"
      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v3
        with:
          name: IndraMQTT Beta 2026.11
          body_path: ${{ runner.temp }}/release-body.md
          prerelease: true
          make_latest: false