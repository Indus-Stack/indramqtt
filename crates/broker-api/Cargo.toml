[package]
name = "broker-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = { workspace = true }
async-trait = { workspace = true }
broker-rules = { workspace = true }
broker-protocol = { workspace = true }
broker-session = { workspace = true }
broker-router = { workspace = true }
broker-observability = { workspace = true }
broker-auth = { workspace = true }
broker-config = { workspace = true }
broker-delayed = { workspace = true }
brokerlink = { workspace = true }
broker-connectors = { workspace = true }
broker-connectors-enterprise = { workspace = true }
broker-storage = { workspace = true }
broker-cluster = { workspace = true }
broker-gateway = { workspace = true }
bytes = { workspace = true }
# In-process dispatch of MCP tool calls through the axum router
# (`tower::ServiceExt::oneshot`). MIT. No socket to self.
tower = { version = "0.5", features = ["util"] }
reqwest = { workspace = true }
regex = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
sha1 = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
chrono = { workspace = true }
tar = "0.4"
flate2 = { workspace = true }
# PEM split plus certificate and key checks for the certificate routes.
# rustls and rustls-pki-types parse the uploads; x509-parser checks each
# certificate body. All three are MIT or Apache-2.0 or ISC.
rustls = { version = "0.23" }
rustls-pki-types = { version = "1" }
x509-parser = { version = "0.18" }

[features]
# Mirrors the connector feature set so registration can fail closed
# naming the missing feature. Each forwards to the owning crate: `s3`,
# `clickhouse`, `kafka`, `elasticsearch` and `rabbitmq` to
# `broker-connectors`, the rest to `broker-connectors-enterprise`.
# Default build matches those crates' defaults (all gated kinds absent).
# A feature build (or `--all-features`) restores the full set.
default = []
s3 = ["broker-connectors/s3"]
clickhouse = ["broker-connectors/clickhouse"]
kafka = ["broker-connectors/kafka"]
elasticsearch = ["broker-connectors/elasticsearch"]
rabbitmq = ["broker-connectors/rabbitmq"]
aws_iot = ["broker-connectors-enterprise/aws_iot"]
azure_blob = ["broker-connectors-enterprise/azure_blob"]
azure_eventhubs = ["broker-connectors-enterprise/azure_eventhubs"]
azure_iot = ["broker-connectors-enterprise/azure_iot"]
bigquery = ["broker-connectors-enterprise/bigquery"]
dynamodb = ["broker-connectors-enterprise/dynamodb"]
gcp_iot = ["broker-connectors-enterprise/gcp_iot"]
cassandra = ["broker-connectors-enterprise/cassandra"]
confluent = ["broker-connectors-enterprise/confluent"]
couchbase = ["broker-connectors-enterprise/couchbase"]
mongodb = ["broker-connectors-enterprise/mongodb"]
gcp_pubsub = ["broker-connectors-enterprise/gcp_pubsub"]
kinesis = ["broker-connectors-enterprise/kinesis"]
opc_ua = ["broker-connectors-enterprise/opc_ua"]

[dev-dependencies]
broker-connectors = { workspace = true }
async-trait = { workspace = true }
rand = { workspace = true }
p256 = "0.14"
