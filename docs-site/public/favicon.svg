<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="indra-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="indra-bolt" x1="20" y1="12" x2="44" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0066cc" />
      <stop offset="100%" stop-color="#004499" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0066cc" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#indra-bg)" stroke="#3f3f46" stroke-width="1.5" />

  <!-- Top Pub Node -->
  <circle cx="32" cy="11" r="4" fill="#ffffff" />

  <!-- Lightning Flow Blade -->
  <path
    d="M32 15L23 30H33L28 47L43 26H32L35 15H32Z"
    fill="url(#indra-bolt)"
    filter="url(#glow)"
  />

  <!-- Bottom Sub Node -->
  <circle cx="28.5" cy="51" r="4" fill="#ffffff" />

  <!-- Left/Right Symmetric Telemetry Node Orbits (MQTT Mesh) -->
  <circle cx="15" cy="30" r="3" fill="#ffffff" opacity="0.85" />
  <line x1="19" y1="30" x2="22.5" y2="30" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.45" />

  <circle cx="49" cy="30" r="3" fill="#ffffff" opacity="0.85" />
  <line x1="41.5" y1="30" x2="45" y2="30" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.45" />
</svg>
