[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.8

exceptions = [
    { allow = ["MIT", "Apache-2.0"], crate = "rekuiper-core" },
    { allow = ["MIT", "Apache-2.0"], crate = "rekuiper-sql" },
    { allow = ["MIT", "Apache-2.0"], crate = "rekuiper-conf" },
    # Mozilla root-certificate data. The licence covers the data, puts no
    # condition on our code, and is scoped to this crate alone.
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
    # Keccak hash via the MongoDB driver. CC0-1.0 is a public-domain
    # dedication with no conditions; scoped to this crate alone.
    { allow = ["CC0-1.0"], crate = "tiny-keccak" },
]

[licenses.private]
ignore = true

[advisories]
version = 2
ignore = [
    # Each entry has no fixed version, or its correction is queued. Remove the
    # entry when the crate leaves the graph; CI fails on any other advisory.
    { id = "RUSTSEC-2023-0071", reason = "rsa: Marvin timing attack, no fixed release. Direct dependency of broker-connectors; replacement queued (DEP-02)." },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile 1.x: unmaintained. Direct dependency of broker-api and broker-connectors; replacement by rustls-pki-types queued (DEP-02)." },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml: unmaintained, no known vulnerability. It comes through serde_yaml in the OPC UA client library (async-opcua-core, its configuration-file loader, which IndraMQTT never calls) and on a test-only path of broker-auth. Remove when the OPC UA library makes YAML optional." },
    { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained proc-macro, build time only, no code at run time. Comes through the rule-engine dependency." },
]

[bans]
multiple-versions = "warn"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-git = [
    "https://github.com/ankur-paan/rekuiper.git",
]
